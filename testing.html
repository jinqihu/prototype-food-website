<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food @ Renert</title>
    <style>
        :root {
            --primary: #d4a017; /* Renert Gold */
            --dark: #1a1a1a;
            --light: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--light); color: var(--dark); }
        
        /* Login Overlay */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); display: flex; align-items: center;
            justify-content: center; z-index: 100; color: white;
        }

        .login-box { text-align: center; background: #222; padding: 40px; border-radius: 15px; border: 2px solid var(--primary); }
        input { padding: 12px; border-radius: 5px; border: none; width: 200px; margin-bottom: 10px; font-size: 1rem; }

        /* Main Interface */
        header { background: var(--dark); color: var(--primary); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        
        /* Food Grid */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 80px; height: 80px; margin-bottom: 10px; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:active { opacity: 0.8; }

        /* Sidebar/Cart */
        #cart-panel { background: white; padding: 20px; border-radius: 12px; margin-top: 30px; border-left: 5px solid var(--primary); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Renert Food Portal</h1>
            <p>Please enter your Student ID to start</p>
            <input type="text" id="student-id" placeholder="ID Number (e.g. 12345)"><br>
            <button class="btn" onclick="login()">Enter Cafeteria</button>
        </div>
    </div>

    <header>
        <h2>Renert School</h2>
        <div id="user-display"></div>
    </header>

    <div class="container">
        <h3>Today's Menu</h3>
        <div class="menu-grid" id="menu-items">
            </div>

        <div id="cart-panel">
            <h3>Current Order</h3>
            <ul id="cart-list"></ul>
            <p><strong>Total: $<span id="total-price">0.00</span></strong></p>
            <button class="btn" onclick="submitOrder()">Confirm & Pay</button>
        </div>
    </div>

    <script>
        const foods = [
            { id: 1, name: "Burger", price: 8.50, emoji: "🍔" },
            { id: 2, name: "Fries", price: 3.00, emoji: "🍟" },
            { id: 3, name: "Salad", price: 6.75, emoji: "🥗" },
            { id: 4, name: "Pizza", price: 4.50, emoji: "🍕" },
            { id: 5, name: "Chicken Strips", price: 7.00, emoji: "🍗" },
            { id: 6, name: "Apple", price: 1.50, emoji: "🍎" },
            { id: 7, name: "Smoothie", price: 3.25, emoji: "🥤" }
        ];

        let cart = [];
        let currentStudentId = "";

        function login() {
            const idInput = document.getElementById('student-id').value;
            if (idInput.length != 4) return alert("Please enter a valid ID");
            
            currentStudentId = idInput;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-display').innerText = "Student: #" + currentStudentId;
            renderMenu();
        }

        function renderMenu() {
            const menuDiv = document.getElementById('menu-items');
            menuDiv.innerHTML = foods.map(food => `
                <div class="card">
                    <div style="font-size: 3rem">${food.emoji}</div>
                    <h4>${food.name}</h4>
                    <p>$${food.price.toFixed(2)}</p>
                    <button class="btn" onclick="addToCart(${food.id})">Add</button>
                </div>
            `).join('');
        }

        function addToCart(foodId) {
            const item = foods.find(f => f.id === foodId);
            cart.push(item);
            updateCart();
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            const totalDisplay = document.getElementById('total-price');
            
            list.innerHTML = cart.map((item, index) => `
                <li>${item.name} - $${item.price.toFixed(2)}</li>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalDisplay.innerText = total.toFixed(2);
        }

        function submitOrder() {
            if (cart.length === 0) return alert("Your tray is empty!");
            alert(`Order confirmed for Student #${currentStudentId}!\nTotal: $${document.getElementById('total-price').innerText}\nPick up at the counter.`);
            cart = [];
            updateCart();
        }
    </script>
</body>
</html>
